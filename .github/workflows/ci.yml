name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Expo SDK versions
        run: pnpm --filter app exec expo install --check
      - name: Web export
        run: pnpm build:web

  android:
    uses: ./.github/workflows/android.yml
    with:
      apk-name: moving-boxes-${{ github.sha }}-arm64.apk
